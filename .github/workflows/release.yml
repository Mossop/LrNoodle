name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The next release tag to use"
        required: false
        type: string

# Ensures that only one release runs at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    # Releases are committed to main so must be made from it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Work out the next version
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ inputs.tag }}
          # The tag is created below once the version is committed.
          dry_run: true

      - name: Update Info.lua version
        env:
          VERSION: ${{ steps.tag_version.outputs.new_version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must be three numbers like 1.2.0, not '$VERSION'"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR REVISION <<< "$VERSION"
          EXPECTED="VERSION = { major = $MAJOR, minor = $MINOR, revision = $REVISION, build = 0 }"
          sed -i -E \
            "s/VERSION = \{ major = [0-9]+, minor = [0-9]+, revision = [0-9]+, build = [0-9]+ \}/$EXPECTED/" \
            LrNoodle.lrdevplugin/Info.lua
          if ! grep -qF "$EXPECTED" LrNoodle.lrdevplugin/Info.lua; then
            echo "::error::Failed to update the version in Info.lua"
            exit 1
          fi

      - name: Commit, tag and push the release
        env:
          TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -am "Release $TAG"
          git tag "$TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      - name: Build the plugin
        run: MISE_CONFIG_ROOT="$GITHUB_WORKSPACE" ./mise-tasks/build

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          generateReleaseNotes: true
          removeArtifacts: true
          artifacts: "LrNoodle.zip"
          allowUpdates: true
