# A throwaway Noodle Gallery or Immich server for the integration tests, started
# by tests/integration/run which sets SERVER_IMAGE and SERVER_PORT. Everything
# is stored in tmpfs so each run starts with an empty server. Machine learning
# is left out since the plugin doesn't use it.

services:
  server:
    image: ${SERVER_IMAGE:?Run the integration tests with tests/integration/run}
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_MACHINE_LEARNING_ENABLED: "false"
      # Immich's startup folder checks sometimes fail on the fresh tmpfs.
      IMMICH_IGNORE_MOUNT_CHECK_ERRORS: "true"
    tmpfs:
      - /data
    ports:
      - "${SERVER_PORT}:2283"
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy

  redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
      interval: 2s

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
    tmpfs:
      - /var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: pg_isready -U postgres -d immich
      interval: 2s
