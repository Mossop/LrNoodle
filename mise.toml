[tools]
lua = "5.1.5"
stylua = "2.6.0"
lua-language-server = "3.19.2"
"cargo:lrv" = "latest"

[tasks.setup]
run = ["luarocks install luacheck", "luarocks install busted"]

[tasks.test]
description = "Run the tests with busted"
run = "busted"

[tasks.luacheck]
description = "Lint the plugin with luacheck"
run = "luacheck LrNoodle.lrdevplugin"
wait_for = ["stylua"]

[tasks.typecheck]
description = "Type check the plugin with lua-language-server"
run = "lua-language-server --check=LrNoodle.lrdevplugin --configpath={{config_root}}/.luarc.json --checklevel=Warning"
wait_for = ["stylua"]

[tasks.stylua]
description = "Format the plugin with StyLua"
run = "stylua LrNoodle.lrdevplugin"

[tasks."integration:noodle"]
description = "Runs the integration tests against a Noodle Gallery server in docker"
run = "tests/integration/run noodle"

[tasks."integration:immich"]
description = "Runs the integration tests against an Immich server in docker"
run = "tests/integration/run immich"
# Two servers at once can run out of memory in Docker.
wait_for = ["integration:noodle"]

[tasks.integration]
description = "Runs the integration tests against Noodle Gallery and Immich"
depends = ["integration:noodle", "integration:immich"]

[tasks.package]
description = "Checks and packages the plugin"
depends = ["stylua", "luacheck", "typecheck", "build"]
